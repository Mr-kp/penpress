name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install System Dependencies (Tesseract OCR, Node.js packages)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tesseract-ocr
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install tesseract
          elif [ "${{ runner.os }}" = "Windows" ]; then
            choco install tesseract --no-progress --retry 3 || winget install --id UB-Mannheim.TesseractOCR -e --source winget --accept-package-agreements --accept-source-agreements || true
            if [ -d "/c/Program Files/Tesseract-OCR" ]; then
              echo "C:\\Program Files\\Tesseract-OCR" >> "$GITHUB_PATH"
            fi
            if [ -d "/c/Program Files/nodejs" ]; then
              echo "C:\\Program Files\\nodejs" >> "$GITHUB_PATH"
            fi
          fi



          if [ -f "research/R2-1/package.json" ]; then
            (cd research/R2-1 && npm install)
          fi
      - name: Install Python Environment
        run: uv sync --python 3.12
      - name: Set docs-check base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "GATE_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              echo "GATE_BASE=$BEFORE" >> "$GITHUB_ENV"
            else
              echo "GATE_BASE=HEAD~1" >> "$GITHUB_ENV"
            fi
          fi
      - name: Gate (lint, types, forbid, board, docs, tests, coverage)
        run: uv run python scripts/gate.py
      - name: Build & Verify Standalone Executable
        shell: bash
        run: |
          uv run python scripts/package.py --release
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/penpress.exe --version
            ./dist/penpress.exe render-text tests/fixtures/p1_5_text_120words.txt --out out_ci
            ./dist/penpress.exe serve --host 127.0.0.1 --port 8999 &
            SERVER_PID=$!
            READY=0
            for i in $(seq 1 30); do
              if curl -s -f http://127.0.0.1:8999/api/health; then
                READY=1
                break
              fi
              sleep 1
            done
            kill $SERVER_PID || true
            if [ "$READY" -ne 1 ]; then
              echo "Server failed to respond to /api/health within 30s"
              exit 1
            fi
          else
            ./dist/penpress --version
            ./dist/penpress render-text tests/fixtures/p1_5_text_120words.txt --out out_ci
            ./dist/penpress serve --host 127.0.0.1 --port 8999 &
            SERVER_PID=$!
            READY=0
            for i in $(seq 1 30); do
              if curl -s -f http://127.0.0.1:8999/api/health; then
                READY=1
                break
              fi
              sleep 1
            done
            kill $SERVER_PID || true
            if [ "$READY" -ne 1 ]; then
              echo "Server failed to respond to /api/health within 30s"
              exit 1
            fi
          fi


