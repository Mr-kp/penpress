[project]
name = "penpress"
version = "0.0.1"
description = "Write assignments in your own handwriting with an Ender 3 Pro pen plotter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
penpress = "penpress.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penpress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["scripts", "research/R0-1", "research/R2-1", "research/R5-1"]

[tool.coverage.run]
branch = true
source = ["src/penpress"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["research/*/vendor", "notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/penpress", "scripts"]
